<script>
(()=>{
const L=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+'₹'+a.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'L'};
const L0=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+'₹'+Math.round(a).toLocaleString('en-IN')+'L'};
const pc=(v,d=2)=>(v*100).toFixed(d)+'%';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
const NS='http://www.w3.org/2000/svg';
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e};
const K=()=>({a:css('--accent'),aS:css('--accent-soft'),f:css('--face'),fS:css('--face-soft'),m:css('--muted'),l:css('--line'),fa:css('--faint'),ink:css('--ink'),par:css('--par'),d:css('--disc'),surf:css('--surface')});
const T=(s,x,y,t,o={})=>s.append(el('text',{x,y,'text-anchor':o.anchor||'middle',class:o.mono?'mono':'',style:`fill:${o.fill||css('--muted')};${o.bold?'font-weight:600;':''}${o.size?'font-size:'+o.size+'px;':''}`},t));
const Rc=(s,x,y,w,h,fill,o={})=>{if(h<=0||w<=0)return;s.append(el('rect',{x,y,width:w,height:h,fill,rx:o.rx??3,...(o.stroke?{stroke:o.stroke,'stroke-width':o.sw||1}:{}),...(o.op!=null?{opacity:o.op}:{})}))};
const Ln=(s,x1,y1,x2,y2,st,w=1)=>s.append(el('line',{x1,y1,x2,y2,stroke:st,'stroke-width':w}));
const note=t=>`<div class="nt">${t}</div>`;
const npv=(c,r)=>c.reduce((s,x,t)=>s+x/Math.pow(1+r,t),0);
const irr=(c,lo=0,hi=1)=>{for(let i=0;i<100;i++){const m=(lo+hi)/2;(npv(c,lo)*npv(c,m)<=0)?hi=m:lo=m}return (lo+hi)/2};
const P=[-200,50,100,150],PB=[-200,100,100,10],TA=[-100,100,10,10],TB=[-100,10,10,120],MU=[-200,200,800,-800];
const IRRP=irr(P);

/* NPV profile chart: series [{c,col,name}] */
function profile(s,k,series,{rmin=0,rmax=0.4,ymin,ymax,R=null,marks=[],ytick,xtick=0.1,top=24,base=280}){
  const Lx=78,Rx=110,pw=760-Lx-Rx,ph=base-top,X=r=>Lx+pw*(r-rmin)/(rmax-rmin),Y=v=>base-ph*(Math.max(ymin,Math.min(ymax,v))-ymin)/(ymax-ymin);
  for(let v=Math.ceil(ymin/ytick)*ytick;v<=ymax+1e-9;v+=ytick){Ln(s,Lx,Y(v),Lx+pw,Y(v),v===0?k.ink:k.l,v===0?1.5:1);T(s,Lx-8,Y(v)+4,L0(v),{anchor:'end',size:11})}
  for(let r=Math.ceil(rmin/xtick-1e-9)*xtick;r<=rmax+1e-9;r+=xtick)T(s,X(r),base+18,Math.round(r*100)+'%',{size:11});
  T(s,Lx+pw/2,base+36,'Discount rate',{size:12});
  series.forEach(({c,col,name})=>{const pts=[];for(let r=rmin;r<=rmax+1e-9;r+=(rmax-rmin)/200)pts.push(X(r)+','+Y(npv(c,r)));
    s.append(el('polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':3,'stroke-linejoin':'round'}));
    if(name){const v=npv(c,rmax);T(s,Lx+pw+8,Y(v)+4,name,{anchor:'start',fill:col,bold:1,size:12})}});
  if(R!=null){Ln(s,X(R),top,X(R),base,k.m,1);T(s,X(R)+4,top+12,'R = '+pc(R,1),{anchor:'start',size:11,fill:k.ink})}
  marks.forEach(([r,v,col,lab,dy=-12,an='middle'])=>{s.append(el('circle',{cx:X(r),cy:Y(v),r:6,fill:k.surf,stroke:col,'stroke-width':2.5}));if(lab)T(s,X(r)+(an==='start'?8:an==='end'?-8:0),Y(v)+dy,lab,{anchor:an,fill:col,bold:1,size:12,mono:1})});
  return {X,Y};
}
/* payback as "filling the cost": each year's cash flow fills the cost bar from left to right */
function fillChart(s,k,rows,{cut}){
  const x0=150,sc=520/300,X=v=>x0+v*sc,cx=X(200);
  Ln(s,cx,30,cx,300,k.ink,2);T(s,cx,22,'Cost ₹200L recovered here',{fill:k.ink,bold:1,size:12});
  rows.forEach(({name,col,flows},j)=>{const y=58+j*130,hgt=46;let cum=0;
    T(s,24,y+hgt/2+5,name,{anchor:'start',fill:col,bold:1,size:14});
    Rc(s,X(0),y,200*sc,hgt,k.fa,{stroke:k.l,rx:4});
    let pb=null,byCut=0;
    flows.forEach((c,i)=>{const t=i+1,a=cum,b=cum+c;
      const inPart=Math.max(0,Math.min(b,200)-a),outPart=c-inPart,op=[.45,.72,1][i];
      if(inPart>0)Rc(s,X(a),y,inPart*sc,hgt,col,{rx:0,op});
      if(outPart>0)Rc(s,X(Math.max(a,200)),y+8,outPart*sc,hgt-16,col,{rx:0,op:.18,stroke:col});
      const wi=inPart*sc,wo=outPart*sc,lab=`Yr ${t}: ${L0(c)}`;
      if(wi>78)T(s,X(a)+wi/2,y+hgt/2+5,lab,{fill:op>.6?k.surf:k.ink,bold:1,size:11,mono:1});
      else if(wo>78)T(s,X(Math.max(a,200))+wo/2,y+hgt/2+5,lab,{fill:k.ink,bold:1,size:11,mono:1});
      else if(wi>22)T(s,X(a)+wi/2,y+hgt/2+5,'Y'+t,{fill:op>.6?k.surf:k.ink,bold:1,size:10});
      if(pb==null&&b>=200-1e-9&&c>0)pb=i+(200-a)/c;
      if(cut>=t)byCut=b;else if(cut>i)byCut=a+(cut-i)*c;
      Ln(s,X(b),y-4,X(b),y+hgt+4,k.surf,1.5);cum=b});
    const bx=X(byCut);s.append(el('polygon',{points:`${bx-7},${y+hgt+16} ${bx+7},${y+hgt+16} ${bx},${y+hgt+5}`,fill:k.d}));
    T(s,bx,y+hgt+30,`by cutoff: ${L0(byCut)}`,{fill:k.d,bold:1,size:11});
    if(cum>200.5)T(s,X(200)+6,y-8,'after payback: ignored',{anchor:'start',size:11,fill:col});
    const msg=pb!=null?`Paid back in ${pb.toFixed(2)} years`:`Never paid back: ${L0(200-cum)} short`;
    T(s,X(0),y-8,msg,{anchor:'start',fill:k.ink,bold:1,size:12});
  });
}
/* cumulative cash-flow chart */
function cumChart(s,k,series,{ymin=-220,ymax=140,cut=null}){
  const Lx=78,Rx=110,top=30,base=270,pw=760-Lx-Rx,ph=base-top,X=t=>Lx+pw*t/3,Y=v=>base-ph*(v-ymin)/(ymax-ymin);
  for(let v=-200;v<=ymax;v+=50){Ln(s,Lx,Y(v),Lx+pw,Y(v),v===0?k.ink:k.l,v===0?1.5:1);T(s,Lx-8,Y(v)+4,L0(v),{anchor:'end',size:11})}
  [0,1,2,3].forEach(t=>T(s,X(t),base+18,t?'Year '+t:'Today',{size:12}));
  if(cut!=null){Ln(s,X(cut),top,X(cut),base,k.d,2);T(s,X(cut)+5,top+12,`Cutoff ${cut} yr${cut>1?'s':''}`,{anchor:'start',fill:k.d,bold:1,size:12})}
  series.forEach(({cum,col,name,pb})=>{s.append(el('polyline',{points:cum.map((v,t)=>X(t)+','+Y(v)).join(' '),fill:'none',stroke:col,'stroke-width':3}));
    cum.forEach((v,t)=>s.append(el('circle',{cx:X(t),cy:Y(v),r:4,fill:col})));
    T(s,Lx+pw+8,Y(cum[3])+4,name,{anchor:'start',fill:col,bold:1,size:12});
    if(pb!=null){s.append(el('circle',{cx:X(pb),cy:Y(0),r:7,fill:k.surf,stroke:col,'stroke-width':3}));T(s,X(pb),Y(0)+(name.includes('B')?22:-12),`${pb.toFixed(2)} yrs`,{fill:col,bold:1,size:12,mono:1})}});
}
const cumOf=(c,r=0)=>{let s=0;return c.map((x,t)=>s+=x/Math.pow(1+r,t))};
const payback=cum=>{for(let t=1;t<cum.length;t++)if(cum[t]>=0&&cum[t-1]<0)return t-1+(-cum[t-1])/(cum[t]-cum[t-1]);return null};

/* ================= STEP 1: NPV ================= */
const S1={n:1,label:'Net present value',eyebrow:'Step 1 · The benchmark',title:'Net Present Value',
 sub:'Deccan Foods is considering a new packaging line at its Medchal plant. It costs ₹200 lakh today and is expected to bring in ₹50, ₹100 and ₹150 lakh over the next three years. Is it worth doing?',
 state:{R:10},
 spec:(st)=>[['Cost today','₹200L','d'],['Cash inflows','₹50L, ₹100L, ₹150L','c'],['Required return',pc(st.R/100,1),'']],
 tabs:[
 {id:'rule',name:'The NPV rule',short:'Value of inflows minus cost',
  def:'Bring every future cash inflow back to today at the required return, add them up, and subtract the cost. What is left is the value the project adds for shareholders.',
  contrast:'Accept if NPV is positive; between projects, pick the highest NPV. NPV uses cash flows, uses all of them, and discounts them properly. Every other rule will be judged against these three tests.',
  ctl:[{key:'R',label:'Required return',min:0,max:30,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'The return shareholders could earn elsewhere at this risk.'}],
  draw(s,st){const k=K(),R=st.R/100,base=182,h=v=>v*0.55,tx=110,X=t=>230+t*150;let pv=0;
   Ln(s,30,base,750,base,k.l,1.5);T(s,34,base+18,'Today',{anchor:'start',bold:1,fill:k.ink});
   for(let t=1;t<=3;t++){const cf=P[t],v=cf/Math.pow(1+R,t);pv+=v;Rc(s,X(t)-26,base-h(cf),52,h(cf),k.fa,{stroke:k.l});Rc(s,X(t)-20,base-h(v),40,h(v),k.a,{rx:2});
     T(s,X(t),base-h(cf)-8,`${L0(cf)} → ${L(v)}`,{mono:1,size:11,fill:k.ink});T(s,X(t),base+18,'Year '+t,{size:12});T(s,X(t),base+36,'÷ '+(1+R).toFixed(3)+sup(t),{mono:1,size:11,fill:k.a})}

  function show(i){cur=Math.max(0,Math.min(S.tabs.length-1,i));const t=S.tabs[cur];
    [...idx.children].forEach((b,j)=>b.setAttribute('aria-selected',j===cur));
    q('.nm').textContent=t.name;q('.def').textContent=t.def;q('.contrast').textContent=t.contrast;
    q('.prev').disabled=cur===0;q('.next').disabled=cur===S.tabs.length-1;q('svg').setAttribute('aria-label',t.name+' chart');
    buildCtl(t);S.render()}
  function buildCtl(t){const box=q('.ctl');box.innerHTML='';box.hidden=!t.ctl.length;
    t.ctl.forEach(c=>{
      if(c.type==='seg'){const w=document.createElement('div');w.className='seg';
        c.options.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.classList.toggle('on',S.state[c.key]===v);b.addEventListener('click',()=>{S.state[c.key]=v;[...w.children].forEach(x=>x.classList.toggle('on',x===b));S.render()});w.append(b)});box.append(w);return}
      const id=`s${S.n}-${t.id}-${c.key}`,w=document.createElement('div');w.className='ctl';
      w.innerHTML=`<label for="${id}">${c.label} <output></output></label><input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${Math.min(c.max,Math.max(c.min,S.state[c.key]))}">${c.note?`<small>${c.note}</small>`:''}`;
      const inp=w.querySelector('input'),out=w.querySelector('output');S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);
      inp.addEventListener('input',()=>{S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);S.render()});box.append(w)})}
  S.render=()=>{const t=S.tabs[cur],svg=q('svg');svg.innerHTML='';
    q('.spec').innerHTML='<div class="spec-h">The project</div>'+S.spec(S.state,t.id).map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('');
    const out=t.draw(svg,S.state);q('.work').innerHTML=out.work;
    q('.legend').innerHTML=out.legend.map(([c,l,st])=>`<span><i style="background:${c};${st?'border:1px solid '+st:''}"></i>${l}</span>`).join('')};
  show(0);
});
const rr=()=>STEPS.forEach(S=>S.render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
