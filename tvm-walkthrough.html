<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: four-step stepper; in each step a concept index on the left and a stage on the right, as in the bond walkthrough. Term index on the left; on the right one stage per term, each with its own picture on a shared cash-flow timeline, a worked number and, where it helps, one control. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --ink:#16223A; --muted:#5B6578; --line:#DADDD8; --faint:#E7E8E3;
  --accent:#6B3FA0; --accent-soft:#EEE6F7; --face:#0F6E8C; --face-soft:#DCEEF3;
  --prem:#2348B8; --disc:#B4530F; --par:#2F6B3F;
  --display:'Source Serif 4', Georgia, serif; --body:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131A; --surface:#1C1E29; --ink:#ECEDF2; --muted:#A1A6B8; --line:#2F3242; --faint:#262938;
  --accent:#B794E6; --accent-soft:#2E2340; --face:#5BB8D4; --face-soft:#16384A;
  --prem:#8FA8F5; --disc:#F0A266; --par:#86C998; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131A; --surface:#1C1E29; --ink:#ECEDF2; --muted:#A1A6B8; --line:#2F3242; --faint:#262938;
  --accent:#B794E6; --accent-soft:#2E2340; --face:#5BB8D4; --face-soft:#16384A;
  --prem:#8FA8F5; --disc:#F0A266; --par:#86C998; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:20px;padding-block:28px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:64ch}
header{display:flex;flex-direction:column;gap:14px}
.spec{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spec>div{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:12px 18px;border-left:1px solid var(--line);flex:1 1 120px}
.spec>div:first-child{border-left:none}
.spec span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spec b{font-family:var(--mono);font-weight:500;font-size:18px}
.spec .spec-h{font-family:var(--display);font-weight:700;font-size:20px;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.index{display:flex;flex-direction:column;gap:6px}
.term{font:inherit;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column}
.term b{font-weight:600}
.term span{font-size:14px;color:var(--muted)}
.term:hover{background:var(--surface)}
.term[aria-selected="true"]{background:var(--surface);border-color:var(--accent)}
.term[aria-selected="true"] b{color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stage h2{font-family:var(--display);font-size:28px;margin:0}
.stage .def{margin:0;max-width:66ch;color:var(--muted);font-size:17px}
svg{width:100%;height:auto;display:block}
svg text{font-family:var(--body);font-size:13px;fill:var(--muted)}
svg text.mono{font-family:var(--mono)}
.readout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.work{background:var(--bg);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.work div{overflow-x:auto;white-space:nowrap}
.work .k{font-family:var(--body);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.work .big{font-size:28px}
.c{color:var(--accent)} .f{color:var(--face)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{display:flex;justify-content:space-between;font-weight:500}
.ctl output{font-family:var(--mono);color:var(--accent)}
.ctl input{width:100%;accent-color:var(--accent)}
.ctl small{color:var(--muted);font-size:14px}
.slice{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.slice div{display:flex;align-items:center;padding-inline:8px;white-space:nowrap;overflow:hidden}
.slice .a{background:var(--accent);color:var(--surface)} .slice .b{background:var(--face-soft);color:var(--face);flex:1}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);gap:2px}
.seg button{flex:1 1 140px;font:500 14px var(--body);border:none;background:transparent;color:var(--ink);padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,220px);padding:6px;background:var(--face-soft);border:1px solid var(--face);border-radius:8px;margin-block:4px}
.grid100 i{display:block;aspect-ratio:1;border-radius:2px;box-shadow:inset 0 0 0 1px var(--face)}
.contrast{font-size:15px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin:0;max-width:70ch}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font:600 15px var(--body);padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.35;cursor:default}
@media (max-width:820px){.layout{grid-template-columns:1fr}.index{flex-direction:row;overflow-x:auto}.term{min-width:150px}.readout{grid-template-columns:1fr}}
.steph{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.1;margin:0}
.shell{padding-bottom:6px}
.shell h1{font-size:clamp(30px,4.4vw,46px)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stepper button{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stepper small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stepper span{font-weight:600}
.stepper button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stepper button[aria-selected="true"] small{color:var(--accent)}
.step{padding-top:8px}
.trio{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.trio i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ctl .ctl{gap:6px}
.work .fm{font-family:var(--mono);font-size:14px;color:var(--muted)}
.work div{white-space:normal}
.readout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
@media (max-width:820px){.readout{grid-template-columns:1fr}}
@media (max-width:760px){.stepper{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
body{margin:0}
.homebar{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:14px 0 0;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-size:14px}
.homebar a{color:var(--accent,#6B3FA0);text-decoration:none;font-weight:600}

<div class="wrap shell">
  <p class="eyebrow">Corporate Finance</p>
  <h1>Time Value of Money</h1>
  <div class="stepper" role="tablist" aria-label="Steps" id="stepper"></div>
</div>
<div id="steps"></div>

<script>
(()=>{
const inr=v=>'₹'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const inr0=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const pc=(v,d=2)=>(v*100).toFixed(d)+'%';
const pct=v=>(+v).toFixed(1)+'%';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
const NS='http://www.w3.org/2000/svg';
function el(tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
const K=()=>({a:css('--accent'),aS:css('--accent-soft'),f:css('--face'),fS:css('--face-soft'),m:css('--muted'),l:css('--line'),fa:css('--faint'),ink:css('--ink'),par:css('--par'),d:css('--disc'),surf:css('--surface')});
function T(s,x,y,t,o={}){s.append(el('text',{x,y,'text-anchor':o.anchor||'middle',class:o.mono?'mono':'',style:`fill:${o.fill||css('--muted')};${o.bold?'font-weight:600;':''}${o.size?'font-size:'+o.size+'px;':''}`},t))}
function R(s,x,y,w,h,fill,o={}){if(h<=0)return;s.append(el('rect',{x,y,width:w,height:h,fill,rx:o.rx??3,...(o.stroke?{stroke:o.stroke,'stroke-width':o.sw||1}:{}),...(o.op!=null?{opacity:o.op}:{})}))}
const Ln=(s,x1,y1,x2,y2,st,w=1)=>s.append(el('line',{x1,y1,x2,y2,stroke:st,'stroke-width':w}));
function axis(s,base,x1=30,x2=750){s.append(el('line',{x1,x2,y1:base,y2:base,stroke:css('--line'),'stroke-width':1.5}))}
const note=t=>`<div style="font-family:var(--body);font-size:14px;color:var(--muted);white-space:normal">${t}</div>`;
const N=5,BASE=262;

/* ---------- Step 1: single sums ---------- */
const S1={n:1,label:'Single sums',eyebrow:'Step 1 · Single sums',title:'Present and Future Value',
 sub:'One amount, moved through time. Compounding carries it forward; discounting brings it back.',
 state:{r:10},
 spec:(st,id)=>id==='cmp'?[['Option A','₹1,000 today','f'],['Option B','₹1,500 in 5 years','c'],['Interest rate',st.r+'%','']]:[['Amount','₹1,000','f'],['Interest rate',st.r+'%','c'],['Years','5','']],
 tabs:[
 {id:'fv',name:'Future value',short:'Where ₹1,000 today ends up',
  def:'The amount a sum invested today grows to, when interest is added every year and then itself earns interest.',
  contrast:'Compounding means interest also earns interest. Over 5 years that extra is modest; over 20 or 30 years it becomes the largest part of the total. A handy check: money doubles in roughly 72 ÷ r years (the rule of 72).',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:0,max:15,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Interest is added once a year.'}],
  draw(s,st){const k=K(),r=st.r/100,P=1000,X=t=>110+t*118,max=P*Math.pow(1.15,5)*1.08,h=v=>v*(BASE-60)/max;
   axis(s,BASE);
   for(let t=0;t<=N;t++){const B=P*Math.pow(1+r,t),si=P*r*t,ex=B-P-si,x=X(t)-22;
    R(s,x,BASE-h(P),44,h(P),k.f);R(s,x,BASE-h(P)-h(si),44,h(si),k.a);R(s,x,BASE-h(B),44,h(ex),k.aS,{stroke:k.a});
    T(s,X(t),BASE-h(B)-8,inr0(B),{mono:1,bold:1,fill:k.ink});
    T(s,X(t),BASE+22,t?'Yr '+t:'Today',{bold:!t,fill:t?k.m:k.ink});
    if(t)T(s,X(t)-59,BASE+42,'× '+(1+r).toFixed(2),{mono:1,fill:k.a,size:12});}
   const f=Math.pow(1+r,N),FV=1000*f;
   return {legend:[[k.f,'Principal'],[k.a,'Simple interest'],[k.aS,'Interest on interest',k.a]],
    work:`<div class="fm">FV = PV × (1+r)ⁿ</div><div>= ₹1,000 × ${(1+r).toFixed(2)}${sup(N)} = ₹1,000 × ${f.toFixed(4)}</div><div class="big">= ${inr(FV)}</div>`+
     `<div class="k">Made up of</div><div><span class="f">₹1,000</span> + <span class="c">${inr0(1000*r*N)}</span> simple interest + <span class="c">${inr(FV-1000-1000*r*N)}</span> interest on interest</div>`};}},
 {id:'pv',name:'Present value',short:'What ₹1,000 later is worth today',
  def:'The amount you would need today to end up with a given sum in the future. It is future value run backwards: divide instead of multiply.',
  contrast:'PV and FV are one equation read in opposite directions. At 10%, ₹620.92 today and ₹1,000 in five years are worth exactly the same.',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:0,max:15,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Also called the discount rate.'}],
  draw(s,st){const k=K(),r=st.r/100,X=t=>110+t*118,max=1080,h=v=>v*(BASE-60)/max;
   axis(s,BASE);T(s,430,30,`Discounting: each step back in time divides by ${(1+r).toFixed(2)}`,{fill:k.f});
   for(let t=0;t<=N;t++){const V=1000/Math.pow(1+r,N-t),x=X(t)-22;
    if(t===N)R(s,x,BASE-h(V),44,h(V),k.fa,{stroke:k.l});else if(t===0)R(s,x,BASE-h(V),44,h(V),k.f);else R(s,x,BASE-h(V),44,h(V),k.fS,{stroke:k.f});
    T(s,X(t),BASE-h(V)-8,inr0(V),{mono:1,bold:1,fill:t===0?k.f:k.ink});
    T(s,X(t),BASE+22,t?'Yr '+t:'Today',{bold:!t,fill:t?k.m:k.ink});
    if(t)T(s,X(t)-59,BASE+42,'÷ '+(1+r).toFixed(2),{mono:1,fill:k.f,size:12});}
   T(s,X(N),BASE-h(1000)/2,'Promised',{fill:k.ink,size:12});
   const f=Math.pow(1+r,N),PV=1000/f;
   return {legend:[[k.fa,'Amount promised in year 5',k.l],[k.fS,'Value at earlier dates',k.f],[k.f,'Value today']],
    work:`<div class="fm">PV = FV ÷ (1+r)ⁿ</div><div>= ₹1,000 ÷ ${(1+r).toFixed(2)}${sup(N)} = ₹1,000 ÷ ${f.toFixed(4)}</div><div class="big">= <span class="f">${inr(PV)}</span></div>`+
     `<div class="k">Check</div><div>${inr(PV)} × ${f.toFixed(4)} = ₹1,000.00</div>`};}},
 {id:'cmp',name:'Comparing amounts',short:'Move money to the same date',
  def:'Which is worth more: ₹1,000 today or ₹1,500 in five years? Rupees at different dates cannot be compared directly. Bring the later amount back to today, then compare.',
  contrast:'The answer depends on the interest rate. Below 8.45% the ₹1,500 is worth more; above it, take the ₹1,000 now. Every decision in this course, from bonds to projects, is this comparison.',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:0,max:20,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'What you could earn on money you hold today.'}],
  draw(s,st){const k=K(),r=st.r/100,pvB=1500/Math.pow(1+r,5),h=v=>v*0.13,base=270,xa=200,xb=470,bw=110;
   axis(s,base);
   R(s,xa-bw/2,base-h(1000),bw,h(1000),k.f,{rx:4});T(s,xa,base-h(1000)-10,'₹1,000',{mono:1,bold:1,fill:k.f,size:15});T(s,xa,base+22,'A: ₹1,000 today',{bold:1,fill:k.ink});
   R(s,xb-bw/2,base-h(1500),bw,h(1500),k.fa,{stroke:k.l,rx:4});R(s,xb-bw/2+8,base-h(pvB),bw-16,h(pvB),k.a,{rx:3});
   T(s,xb,base-h(1500)-10,'₹1,500 in year 5',{mono:1,fill:k.m,size:13});T(s,xb+bw/2+10,base-h(pvB)+16,`worth ${inr(pvB)} today`,{anchor:'start',mono:1,bold:1,fill:k.a,size:13});
   T(s,xb,base+22,'B: ₹1,500 in 5 years',{bold:1,fill:k.ink});
   Ln(s,xa-bw/2-20,base-h(1000),xb+bw/2+20,base-h(1000),k.f,1.5);
   const w=Math.abs(pvB-1000)<0.5?'Same value':pvB>1000?'B is worth more':'A is worth more';
   T(s,20,34,w,{anchor:'start',bold:1,fill:pvB>1000?k.a:k.f,size:18});T(s,20,56,`÷ ${(1+r).toFixed(3)}${sup(5)} brings ₹1,500 back to today`,{anchor:'start',size:12});
   return {legend:[[k.f,'Option A, today'],[k.fa,'Option B, paid in year 5',k.l],[k.a,'Option B, valued today']],
    work:`<div class="fm">PV of B = ₹1,500 ÷ (1 + r)⁵</div><div>= ₹1,500 ÷ ${Math.pow(1+r,5).toFixed(4)} = <span class="c">${inr(pvB)}</span></div><div class="big">${w}</div>`+note('Break-even rate: (1,500 ÷ 1,000)^(1/5) − 1 = 8.45%.')};}}
 ]};

/* ---------- Step 2: level cash flows ---------- */
const af=(r,n)=>r===0?n:(1-Math.pow(1+r,-n))/r, ff=(r,n)=>r===0?n:(Math.pow(1+r,n)-1)/r;
function perpBars(s,k,amt,r,label){ // 15 fading bars + forever + price tile
  const yrs=15,x0=240,x1=700,X=t=>x0+(x1-x0-90)*(t-1)/(yrs-1),bw=18,max=Math.max(...amt)*1.35,h=v=>v*150/max;
  axis(s,BASE);T(s,110,BASE+22,'Today',{bold:1,fill:k.ink});
  for(let t=1;t<=yrs;t++){const A=amt[t-1],pv=A/Math.pow(1+r,t),x=X(t)-bw/2,op=1-0.45*(t-1)/(yrs-1);
    R(s,x,BASE-h(A),bw,h(A),k.fa,{stroke:k.l,rx:2,op});R(s,x+3,BASE-h(pv),bw-6,h(pv),k.a,{rx:1.5,op});
    if([1,5,10,15].includes(t)){T(s,X(t),BASE+22,'Yr '+t);T(s,X(t),BASE-h(A)-8,inr0(pv),{mono:1,fill:k.ink})}}
  T(s,X(yrs)+50,BASE-40,'…',{fill:k.m,size:22});T(s,X(yrs)+50,BASE+22,'forever',{fill:k.a,bold:1});
  T(s,470,34,label,{fill:k.a});
}
function tile(s,k,v,sub){R(s,58,BASE-118,104,96,k.aS,{stroke:k.a,sw:1.5,rx:10});T(s,110,BASE-90,'Value today');T(s,110,BASE-58,v,{mono:1,bold:1,fill:k.ink,size:20});T(s,110,BASE-36,sub,{fill:k.a})}
const S2={n:2,label:'Level cash flows',eyebrow:'Step 2 · Level cash flows',title:'Annuities and Perpetuities',
 sub:'The same payment every year. Stop after a fixed number of years and it is an annuity; never stop and it is a perpetuity.',
 state:{r:10},
 spec:(st,id)=>[['Payment','₹100 a year','c'],['Interest rate',st.r+'%','c'],['Years',id==='perp'?'Forever':'5','']],
 tabs:[
 {id:'apv',name:'Annuity: present value',short:'5 payments, valued today',
  def:'A fixed payment at the end of each year for a set number of years. Its present value is the sum of each payment discounted back to today.',
  contrast:'The formula is a shortcut for adding up the five shaded bars. This is exactly the coupon part of a bond.',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:1,max:15,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Payments come at the end of each year.'}],
  draw(s,st){const k=K(),r=st.r/100,X=t=>240+(t-1)*115,max=520,h=v=>v*(BASE-60)/max;let tot=0;
   axis(s,BASE);T(s,110,BASE+22,'Today',{bold:1,fill:k.ink});
   for(let t=1;t<=N;t++){const pv=100/Math.pow(1+r,t);tot+=pv;const x=X(t)-22;
    R(s,x,BASE-h(100),44,h(100),k.fa,{stroke:k.l});R(s,x+4,BASE-h(pv),36,h(pv),k.a,{rx:2});
    T(s,X(t),BASE-h(100)-8,inr0(pv),{mono:1,bold:1,fill:k.ink});T(s,X(t),BASE+22,'Yr '+t);T(s,X(t),BASE+42,'÷ '+(1+r).toFixed(2)+sup(t),{mono:1,fill:k.a,size:12})}
   R(s,85,BASE-h(tot),50,h(tot),k.a,{rx:2});T(s,110,BASE-h(tot)-8,inr0(tot),{mono:1,bold:1,fill:k.ink});
   return {legend:[[k.fa,'Payment received',k.l],[k.a,'Its value today']],
    work:`<div class="fm">PV = C × [1 − (1+r)⁻ⁿ] ÷ r</div><div>= ₹100 × [1 − ${(1+r).toFixed(2)}⁻${sup(N)}] ÷ ${r.toFixed(3)}</div><div>= ₹100 × ${af(r,N).toFixed(4)}</div><div class="big">= <span class="c">${inr(100*af(r,N))}</span></div>`};}},
 {id:'afv',name:'Annuity: future value',short:'5 payments, valued at the end',
  def:'The same five payments, but valued at the end of year 5. Each payment earns interest from the day it arrives until year 5.',
  contrast:'The first payment grows for four years, the last earns nothing. FV of the annuity is also just its PV carried forward five years.',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:1,max:15,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Each payment is reinvested at this rate.'}],
  draw(s,st){const k=K(),r=st.r/100,X=t=>150+(t-1)*100,max=740,h=v=>v*(BASE-60)/max;
   axis(s,BASE);
   for(let t=1;t<=N;t++){const x=X(t)-22;R(s,x,BASE-h(100),44,h(100),k.a,{op:1-0.13*(t-1)});T(s,X(t),BASE-h(100)-8,'₹100',{mono:1,fill:k.ink});T(s,X(t),BASE+22,'Yr '+t);
    T(s,X(t),BASE+42,N-t?'× '+(1+r).toFixed(2)+sup(N-t):'× 1',{mono:1,fill:k.a,size:12})}
   const sx=660;let y=BASE,tot=0;
   for(let t=1;t<=N;t++){const v=100*Math.pow(1+r,N-t);tot+=v;R(s,sx-30,y-h(v),60,h(v)-1,k.a,{rx:2,op:1-0.13*(t-1)});
    if(h(v)>15)T(s,sx,y-h(v)/2+4,inr0(v),{mono:1,fill:k.surf,size:12,bold:1});y-=h(v)}
   T(s,sx,y-8,inr0(tot),{mono:1,bold:1,fill:k.ink});T(s,sx,BASE+22,'Value at Yr 5',{bold:1,fill:k.ink});
   s.append(el('line',{x1:580,x2:580,y1:60,y2:BASE,stroke:k.l,'stroke-width':1}));
   const PV=100*af(r,N),f=Math.pow(1+r,N);
   return {legend:[[k.a,'Payment, darker = earlier, so it grows longer']],
    work:`<div class="fm">FV = C × [(1+r)ⁿ − 1] ÷ r</div><div>= ₹100 × [${(1+r).toFixed(2)}${sup(N)} − 1] ÷ ${r.toFixed(3)} = ₹100 × ${ff(r,N).toFixed(4)}</div><div class="big">= <span class="c">${inr(100*ff(r,N))}</span></div>`+
     `<div class="k">Check</div><div>PV ${inr(PV)} × ${f.toFixed(4)} = ${inr(PV*f)}</div>`};}},
 {id:'perp',name:'Perpetuity',short:'The same payment forever',
  def:'A fixed payment every year with no end date. Two ways to see why it still has a finite value: an endowment that pays out only its interest, and payments that shrink towards zero once valued today.',
  contrast:'An annuity is a perpetuity that stops. At 10%: a perpetuity today is worth ₹1,000; one starting after year 5 is worth ₹620.92 today; the difference, ₹379.08, is the 5-year annuity.',
  ctl:[{type:'slider',key:'r',label:'Interest rate',min:1,max:15,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'A lower rate makes distant payments worth more.'}],
  draw(s,st){const k=K(),r=st.r/100,V=100/r;
   T(s,20,20,`1. Put ${inr(V)} in the bank at ${pct(st.r)}`,{anchor:'start',bold:1,fill:k.ink,size:14});
   const b1=150,cols=['Today','Yr 1','Yr 2','Yr 3','Yr 4','Yr 5'],X=i=>90+i*108,bw=66,bh=66;axis(s,b1);
   cols.forEach((c,i)=>{const x=X(i)-bw/2;R(s,x,b1-bh,bw,bh,k.fS,{stroke:k.f,sw:1.5,rx:4});T(s,X(i),b1-bh/2+4,inr0(V),{size:12,mono:1,bold:1,fill:k.f});T(s,X(i),b1+16,c,{size:12,fill:i?k.m:k.ink,bold:!i});
    if(i>0){R(s,X(i)-40,b1-bh-28,80,22,k.a,{rx:4});T(s,X(i),b1-bh-13,'₹100 out',{size:11,bold:1,fill:k.surf})}});
   T(s,X(5)+50,b1-bh/2+4,'… forever',{anchor:'start',size:12,bold:1,fill:k.f});
   T(s,90-bw/2,b1+36,`The balance earns ₹100 of interest each year. That pays the ₹100, so the ${inr(V)} is never used up.`,{anchor:'start',size:12});
   T(s,20,214,'2. Value each payment today: they shrink towards zero, so the total is finite',{anchor:'start',bold:1,fill:k.ink,size:14});
   const b2=310,yrs=24,x0=60,x1=600,X2=t=>x0+(x1-x0)*(t-1)/(yrs-1),w=16,h=v=>v/100*70;axis(s,b2);
   for(let t=1;t<=yrs;t++){const pv=100/Math.pow(1+r,t);R(s,X2(t)-w/2,b2-h(100),w,h(100),k.fa,{stroke:k.l,rx:2});R(s,X2(t)-w/2+2,b2-h(pv),w-4,h(pv),k.a,{rx:1.5,op:1-0.5*(t-1)/(yrs-1)})}
   [1,10,20].forEach(t=>{const pv=100/Math.pow(1+r,t);T(s,X2(t),b2-h(100)-6,inr(pv),{size:10,mono:1,bold:1,fill:k.ink})});
   T(s,x1+28,b2-26,'… ∞',{anchor:'start',size:16,bold:1,fill:k.a});T(s,x1+28,b2-8,`total ${inr(V)}`,{anchor:'start',size:12,bold:1,fill:k.f,mono:1});
   const cum=n=>100*af(r,n);
   return {legend:[[k.fS,'Balance in the bank',k.f],[k.a,'Payment, and its value today'],[k.fa,'Payment received',k.l]],
    work:`<div class="fm">PV = C ÷ r</div><div>= ₹100 ÷ ${r.toFixed(3)}</div><div class="big">= <span class="c">${inr(V)}</span></div>`+
     note(`Check: interest on ${inr(V)} at ${pct(st.r)} is ₹100 a year. Adding up the payments: first 10 years ${inr0(cum(10))}, first 50 years ${inr0(cum(50))}, never more than ${inr0(V)}.`)};}}
 ]};

/* ---------- Step 3: growing cash flows ---------- */
const R3=0.10;
const gaPV=(c,r,g,n)=>Math.abs(r-g)<1e-12?n*c/(1+r):c/(r-g)*(1-Math.pow((1+g)/(1+r),n));
const S3={n:3,label:'Growing cash flows',eyebrow:'Step 3 · Growing cash flows',title:'Growing Annuities and Perpetuities',
 sub:'The payment rises by a fixed percentage every year, like a salary, a rent or a dividend.',
 state:{g:5},
 spec:(st,id)=>[['First payment','₹100','c'],['Growth rate',st.g+'%','c'],['Interest rate','10%',''],['Years',id==='gp'?'Forever':'5','']],
 tabs:[
 {id:'ga',name:'Growing annuity',short:'Rising payments for 5 years',
  def:'Payments that grow at rate g each year for a fixed number of years. The first payment is ₹100, the next is ₹100 × (1 + g), and so on.',
  contrast:'Set growth to 0% and the formula collapses to the ordinary annuity: ₹379.08 at 10%.',
  ctl:[{type:'slider',key:'g',label:'Growth rate',min:0,max:9,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Each payment is this much larger than the one before.'}],
  draw(s,st){const k=K(),g=st.g/100,r=R3,X=t=>240+(t-1)*115,max=520,h=v=>v*(BASE-60)/max;let tot=0;
   axis(s,BASE);T(s,110,BASE+22,'Today',{bold:1,fill:k.ink});
   for(let t=1;t<=N;t++){const A=100*Math.pow(1+g,t-1),pv=A/Math.pow(1+r,t);tot+=pv;const x=X(t)-22;
    R(s,x,BASE-h(A),44,h(A),k.fa,{stroke:k.l});R(s,x+4,BASE-h(pv),36,h(pv),k.a,{rx:2});
    T(s,X(t),BASE-h(A)-8,inr0(A),{mono:1,fill:k.m});T(s,X(t),BASE+22,'Yr '+t);T(s,X(t),BASE+42,inr0(pv),{mono:1,bold:1,fill:k.a,size:13})}
   T(s,170,BASE+42,'Value today:',{anchor:'end',fill:k.a,size:12});
   R(s,85,BASE-h(tot),50,h(tot),k.a,{rx:2});T(s,110,BASE-h(tot)-8,inr0(tot),{mono:1,bold:1,fill:k.ink});
   const ratio=(1+g)/(1+r);
   return {legend:[[k.fa,'Payment received (grows each year)',k.l],[k.a,'Its value today']],
    work:`<div class="fm">PV = C₁ ÷ (r − g) × [1 − ((1+g) ÷ (1+r))ⁿ]</div><div>= ₹100 ÷ ${(r-g).toFixed(3)} × [1 − (${(1+g).toFixed(3)} ÷ ${(1+r).toFixed(2)})${sup(N)}]</div>`+
     (Math.abs(r-g)<1e-12?'':`<div>= ${inr0(100/(r-g))} × ${(1-Math.pow(ratio,N)).toFixed(4)}</div>`)+`<div class="big">= <span class="c">${inr(gaPV(100,r,g,N))}</span></div>`+
     note(`Ordinary annuity with the same first payment: ${inr(100*af(r,N))}.`)};}},
 {id:'gp',name:'Growing perpetuity',short:'Rising payments forever',
  def:'Payments that grow at rate g every year, forever. It has a finite value only when the growth rate is below the interest rate.',
  contrast:'As g gets close to r the value shoots up, and at g ≥ r there is no finite answer. This formula is also the Gordon growth model used to value shares from their dividends.',
  ctl:[{type:'slider',key:'g',label:'Growth rate',min:0,max:9,step:0.5,fmt:v=>v.toFixed(1)+'%',note:'Must stay below the 10% interest rate.'}],
  draw(s,st){const k=K(),g=st.g/100,r=R3,amt=Array.from({length:15},(_,i)=>100*Math.pow(1+g,i));
   perpBars(s,k,amt,r,`Payments start at ₹100 and grow ${st.g.toFixed(1)}% a year, forever.`);
   const V=100/(r-g);tile(s,k,inr0(V),'C₁ ÷ (r − g)');const cum=n=>gaPV(100,r,g,n);
   return {legend:[[k.fa,'Payment received (grows each year)',k.l],[k.a,'Its value today']],
    work:`<div class="fm">PV = C₁ ÷ (r − g)</div><div>= ₹100 ÷ (${r.toFixed(2)} − ${g.toFixed(3)}) = ₹100 ÷ ${(r-g).toFixed(3)}</div><div class="big">= <span class="c">${inr(V)}</span></div>`+
     note(`Adding up the shaded bars: first 15 years ${inr0(cum(15))}, first 50 years ${inr0(cum(50))}, first 200 years ${inr0(cum(200))}.`)};}}
 ]};

/* ---------- Step 4: APR and EAR ---------- */
const FREQ={1:['Yearly','year'],2:['Half-yearly','half-year'],4:['Quarterly','quarter'],12:['Monthly','month'],365:['Daily','day']};
const ear=(a,m)=>Math.pow(1+a/m,m)-1;
const S4={n:4,label:'APR and EAR',eyebrow:'Step 4 · Quoted vs effective rates',title:'APR and EAR',
 sub:'Banks quote an annual rate but often add interest more than once a year. The quoted rate and the rate you actually earn or pay are not the same.',
 state:{apr:12,m:4},
 spec:(st)=>[['Deposit','₹1,000','f'],['APR',st.apr+'%','c'],['Compounding',FREQ[st.m][0],''],['Horizon','1 year','']],
 tabs:[
 {id:'apr',name:'APR',short:'The quoted annual rate',
  def:'The annual percentage rate is the rate quoted per year. If interest is added m times a year, each period earns APR ÷ m, and interest earned in early periods earns interest later in the year.',
  contrast:'APR ignores compounding within the year. The interest you actually earn over the year is more than the APR whenever interest is added more than once.',
  ctl:[{type:'slider',key:'apr',label:'APR',min:1,max:36,step:1,fmt:v=>v.toFixed(0)+'%',note:'The rate printed on the deposit or loan.'},
       {type:'seg',key:'m',options:[[1,'Yearly'],[2,'Half-yearly'],[4,'Quarterly'],[12,'Monthly']]}],
  draw(s,st){if(st.m>12)st.m=12;const k=K(),a=st.apr/100,m=st.m,i=a/m,X=j=>110+j*(590/m),max=1000*ear(a,12)*1.2,h=v=>v*(BASE-70)/max;
   axis(s,BASE);
   const lab=j=>j===0?'Start':m===1?'Yr end':m===2?(j*6)+' mo':m===4?'Q'+j:'M'+j;
   const bw=Math.min(44,590/m*0.6);
   for(let j=0;j<=m;j++){const I=1000*(Math.pow(1+i,j)-1),si=1000*i*j,x=X(j)-bw/2;
    R(s,x,BASE-h(si),bw,h(si),k.a);R(s,x,BASE-h(I),bw,h(I-si),k.aS,{stroke:k.a});
    if(j&&(m<=4||j===m))T(s,X(j),BASE-h(I)-8,inr(I),{mono:1,bold:1,fill:k.ink,size:12});
    T(s,X(j),BASE+22,lab(j),{size:m===12?11:13,bold:!j,fill:j?k.m:k.ink});}
   T(s,430,34,`Interest added ${m} time${m>1?'s':''} a year at ${pc(i)} per ${FREQ[m][1]}`,{fill:k.a});
   const B=1000*Math.pow(1+i,m);
   return {legend:[[k.a,'Simple interest'],[k.aS,'Interest on interest',k.a]],
    work:`<div class="fm">Rate per period = APR ÷ m</div><div>= ${st.apr}% ÷ ${m} = <span class="c">${pc(i,3)}</span> per ${FREQ[m][1]}</div>`+
     `<div class="k">Balance after 1 year</div><div>₹1,000 × (1 + ${i.toFixed(4)})${sup(m)} = ${inr(B)}</div>`+
     `<div class="big">Interest ${inr(B-1000)}</div>`+note(`That is ${pc(ear(a,m))} of ₹1,000, more than the ${st.apr}% APR. This actual rate is the EAR: next tab.`)};}},
 {id:'ear',name:'EAR',short:'The rate you actually get',
  def:'The effective annual rate is the interest actually earned or paid over a year once compounding within the year is included. It is the right rate for comparing offers.',
  contrast:'To compare a loan quoted monthly with one quoted quarterly, convert both to EAR. The gap is small at low rates and large at credit-card rates: try 36%.',
  ctl:[{type:'slider',key:'apr',label:'APR',min:1,max:36,step:1,fmt:v=>v.toFixed(0)+'%',note:'Same APR, different compounding.'},
       {type:'seg',key:'m',options:[[1,'Yearly'],[2,'Half-yearly'],[4,'Quarterly'],[12,'Monthly'],[365,'Daily']]}],
  draw(s,st){const k=K(),a=st.apr/100,cols=[[1,'Yearly'],[2,'Half-yearly'],[4,'Quarterly'],[12,'Monthly'],[365,'Daily'],[0,'Continuous']];
   const vals=cols.map(([m])=>m?ear(a,m):Math.exp(a)-1),max=vals[5]*1.18,h=v=>v*(BASE-70)/max,X=j=>150+j*105;
   axis(s,BASE);
   cols.forEach(([m,name],j)=>{const v=vals[j],sel=m===st.m,x=X(j)-24;
    R(s,x,BASE-h(v),48,h(v),sel?k.a:(m?k.aS:k.fS),{stroke:m?k.a:k.f});
    T(s,X(j),BASE-h(v)-8,pc(v),{mono:1,bold:1,fill:sel?k.a:k.ink});T(s,X(j),BASE+22,name,{bold:sel,fill:sel?k.a:k.m,size:13})});
   const ya=BASE-h(a);s.append(el('line',{x1:100,x2:720,y1:ya,y2:ya,stroke:k.par,'stroke-width':1.5}));
   T(s,96,ya+4,'APR '+st.apr+'%',{anchor:'end',fill:k.par,bold:1,size:12});
   const m=st.m,E=ear(a,m);
   return {legend:[[k.a,'Selected compounding'],[k.aS,'Other frequencies',k.a],[k.par,'APR (the quoted rate)']],
    work:`<div class="fm">EAR = (1 + APR ÷ m)ᵐ − 1</div><div>= (1 + ${a.toFixed(2)} ÷ ${m})${m===365?'³⁶⁵':sup(m)} − 1</div><div class="big">= <span class="c">${pc(E)}</span></div>`+
     `<div class="k">Continuous compounding</div><div>e^APR − 1 = ${pc(Math.exp(a)-1)}</div>`};}}
 ]};

const STEPS=[S1,S2,S3,S4];

/* ---------- framework ---------- */
const stepper=document.getElementById('stepper'),host=document.getElementById('steps');
STEPS.forEach((S,si)=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',si===0);b.innerHTML=`<small>Step ${S.n}</small><span>${S.label}</span>`;
  b.addEventListener('click',()=>{[...stepper.children].forEach(x=>x.setAttribute('aria-selected',x===b));STEPS.forEach(X=>X.sec.hidden=X!==S);S.render();window.scrollTo({top:0,behavior:'smooth'})});
  stepper.append(b);
  const sec=document.createElement('section');sec.className='step';sec.hidden=si>0;S.sec=sec;
  sec.innerHTML=`<div class="wrap"><header><p class="eyebrow">${S.eyebrow}</p><h2 class="steph">${S.title}</h2><p class="sub">${S.sub}</p><div class="spec" aria-label="Our example"></div></header>
   <div class="layout"><div class="index" role="tablist" aria-label="Concepts"></div>
   <section class="stage" role="tabpanel" aria-live="polite"><h2 class="nm"></h2><p class="def"></p>
   <svg viewBox="0 0 760 330" role="img"></svg><div class="trio legend"></div>
   <div class="readout"><div class="work"></div><div class="ctl"></div></div>
   <p class="contrast"></p><div class="nav"><button class="btn prev">Previous</button><button class="btn primary next">Next</button></div></section></div></div>`;
  host.append(sec);
  const q=c=>sec.querySelector(c),idx=q('.index');let cur=0;
  S.tabs.forEach((t,i)=>{const bt=document.createElement('button');bt.className='term';bt.setAttribute('role','tab');bt.innerHTML=`<b>${t.name}</b><span>${t.short}</span>`;bt.addEventListener('click',()=>show(i));idx.append(bt)});
  q('.prev').addEventListener('click',()=>show(cur-1));q('.next').addEventListener('click',()=>{if(cur<S.tabs.length-1)show(cur+1);else if(STEPS[si+1])stepper.children[si+1].click()});
  function show(i){cur=Math.max(0,Math.min(S.tabs.length-1,i));const t=S.tabs[cur];
    [...idx.children].forEach((b,j)=>b.setAttribute('aria-selected',j===cur));
    q('.nm').textContent=t.name;q('.def').textContent=t.def;q('.contrast').textContent=t.contrast;
    q('.prev').disabled=cur===0;const last=cur===S.tabs.length-1;q('.next').disabled=last&&!STEPS[si+1];q('.next').textContent=last&&STEPS[si+1]?'Next step: '+STEPS[si+1].label:'Next';q('svg').setAttribute('aria-label',t.name+' chart');
    buildCtl(t);S.render()}
  function buildCtl(t){const box=q('.ctl');box.innerHTML='';
    t.ctl.forEach((c,ci)=>{
      if(c.type==='slider'){const id=`s${S.n}-${c.key}`;const w=document.createElement('div');w.className='ctl';
        w.innerHTML=`<label for="${id}">${c.label} <output></output></label><input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${Math.min(c.max,Math.max(c.min,S.state[c.key]))}"><small>${c.note}</small>`;
        const inp=w.querySelector('input'),out=w.querySelector('output');S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);
        inp.addEventListener('input',()=>{S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);S.render()});box.append(w)}
      else{const w=document.createElement('div');w.className='seg';w.setAttribute('role','group');
        if(!c.options.some(o=>o[0]===S.state[c.key]))S.state[c.key]=c.options[c.options.length-1][0];
        c.options.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.classList.toggle('on',v===S.state[c.key]);
          b.addEventListener('click',()=>{S.state[c.key]=v;[...w.children].forEach(x=>x.classList.toggle('on',x===b));S.render()});w.append(b)});box.append(w)}
    })}
  S.render=()=>{const t=S.tabs[cur],svg=q('svg');svg.innerHTML='';
    q('.spec').innerHTML='<div class="spec-h">Our example</div>'+S.spec(S.state,t.id).map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('');
    const out=t.draw(svg,S.state);q('.work').innerHTML=out.work;
    q('.legend').innerHTML=out.legend.map(([c,l,st])=>`<span><i style="background:${c};${st?'border:1px solid '+st:''}"></i>${l}</span>`).join('')};
  show(0);
});
const rr=()=>STEPS.forEach(S=>S.render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>

</html>
